# 테스트는 Testcontainers 가 띄운 PostgreSQL 을 씁니다.
# 접속 정보는 PostgresTestSupport 의 @DynamicPropertySource 가 주입합니다.
spring:
  jpa:
    # 운영과 동일하게 Flyway 가 스키마를 만들고 Hibernate 는 validate 만 해야,
    # 마이그레이션 스크립트와 엔티티 매핑이 어긋나는 것을 테스트에서 잡을 수 있습니다.
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
app:
  jwt:
    secret: "TEST_ONLY_SECRET_THAT_IS_LONG_ENOUGH_FOR_HS256_0123456789"
    access-token-exp-minutes: 10
  kakao:
    # 카카오 API 는 테스트에서 KakaoClient 를 목으로 바꿔 호출하지 않는다. 앱 ID 비교에 쓰는 값만 둔다.
    app-id: 1000001

logging:
  level:
    org.hibernate.SQL: warn
