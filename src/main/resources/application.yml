spring:
  datasource:
    # 로컬은 compose.yaml 의 컨테이너 기본값을 쓰고, 다른 환경은 환경변수로 덮어씁니다.
    url: ${DB_URL:jdbc:postgresql://localhost:5433/segye}
    username: ${DB_USERNAME:ssafy}
    password: ${DB_PASSWORD:ssafy}
  jpa:
    hibernate:
      # 스키마 변경은 db/migration 의 Flyway 스크립트로만 합니다. Hibernate 는 엔티티와 스키마가
      # 맞는지 부팅 시 검증만 하므로, 엔티티를 고치면 같은 PR 에 마이그레이션도 추가해야 합니다.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

logging:
  level:
    org.hibernate.SQL: debug

app:
  jwt:
    # 운영 환경에서는 환경변수 JWT_SECRET을 반드시 설정하세요
    secret: "${JWT_SECRET:CHANGE_ME_TO_A_LONG_RANDOM_SECRET_CHANGE_ME_1234567890}"
    access-token-exp-minutes: 120
  kakao:
    # Kakao Developers 앱 관리 페이지 상단의 앱 ID. 로그인 토큰이 우리 앱에서 발급됐는지 확인합니다.
    # 비어 있으면 카카오 로그인은 모두 거절됩니다(로컬에서는 dev-login 을 쓰세요).
    app-id: ${KAKAO_APP_ID:}
    # [앱] > [어드민 키]. 탈퇴 시 연결 끊기에만 씁니다. 저장소·이슈·채팅에 절대 올리지 마세요.
    admin-key: ${KAKAO_ADMIN_KEY:}
  auth:
    # 카카오 없이 memberId 로 토큰을 받는 개발용 로그인. prod 프로필에서는 이 값과 상관없이 꺼집니다.
    dev-login-enabled: ${DEV_LOGIN_ENABLED:false}
